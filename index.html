<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Army Coding — I Want You for A.I. Army</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f140d; --panel:#161c11; --line:#2c3620; --cream:#f3ecd9;
    --green:#7dd87a; --gold:#f4b400;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(1100px 520px at 50% -8%, #1a2213, transparent 70%),
      var(--bg);
    color:var(--cream);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:28px 18px;gap:18px;
  }

  /* small top chrome */
  .chrome{font-size:12px;letter-spacing:.14em;color:var(--green);text-transform:uppercase;opacity:.9}
  .chrome b{color:var(--cream)}

  /* the poster */
  .poster{
    position:relative;container-type:inline-size;width:100%;max-width:460px;
    border:1px solid var(--line);border-radius:6px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 0 0 6px rgba(243,236,217,.04);
    background:var(--panel);
  }
  .poster img{display:block;width:100%;height:auto}

  /* registration brackets */
  .bracket{position:absolute;width:34px;height:34px;border:2px solid rgba(243,236,217,.5);pointer-events:none}
  .bracket.tl{top:12px;left:12px;border-right:0;border-bottom:0}
  .bracket.tr{top:12px;right:12px;border-left:0;border-bottom:0}
  .bracket.bl{bottom:12px;left:12px;border-right:0;border-top:0}
  .bracket.br{bottom:12px;right:12px;border-left:0;border-top:0}

  /* bottom vignette (blends base into the poster) */
  .fade{position:absolute;left:0;right:0;bottom:0;height:20%;
    background:linear-gradient(to bottom, transparent, rgba(15,20,13,.70) 74%, rgba(15,20,13,.95));
    pointer-events:none}
  /* corner cover — swallows the source watermark without darkening the centered hand */
  .corner-cover{position:absolute;right:0;bottom:0;width:54%;height:17%;pointer-events:none;
    background:radial-gradient(130% 150% at 100% 100%, rgba(15,20,13,.985) 34%, transparent 72%)}

  /* headline banners */
  .banner{position:absolute;left:0;right:0;text-align:center;color:#fff;white-space:nowrap;
    text-shadow:0 2px 10px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.5)}
  .banner.top{top:2.2%;font-family:'Archivo Black',sans-serif;font-size:14cqw;letter-spacing:-.01em}
  .banner.bot{bottom:4.5%;font-size:12cqw;letter-spacing:0}
  .banner.bot .for{font-family:'Archivo Black',sans-serif}
  /* A.I. ARMY — robot font, brushed metal with red/white/blue horizontal bands */
  .banner.bot .ai{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:.82em;letter-spacing:.012em;
    text-shadow:none;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 20%,
        rgba(0,0,0,.30) 50%, rgba(255,255,255,.35) 72%, rgba(0,0,0,.34) 100%),
      linear-gradient(180deg,
        #d0332f 0 34%, #f5f1e6 34% 66%, #2b56a8 66% 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    -webkit-text-stroke:1.1px rgba(18,15,10,.6);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));
  }

  /* manifesto: code comment */
  .manifesto{font-size:13px;letter-spacing:.05em;color:var(--green)}
  .manifesto b{color:var(--cream);font-weight:600}
  .manifesto .cur{display:inline-block;width:8px;height:15px;background:var(--green);
    vertical-align:-2px;margin-left:6px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  @media(max-width:420px){ .chrome{font-size:11px} }
</style>
</head>
<body>

  <div class="chrome">// armycoding.com &nbsp;·&nbsp; <b>enlistment notice</b></div>

  <div class="poster">
    <img src="assets/recruiter.png" alt="A robot army sergeant pointing directly at you">
    <div class="fade"></div>
    <div class="corner-cover"></div>
    <div class="bracket tl"></div><div class="bracket tr"></div>
    <div class="bracket bl"></div><div class="bracket br"></div>
    <div class="banner top">I WANT YOU</div>
    <div class="banner bot"><span class="for">FOR </span><span class="ai">A.I. ARMY</span></div>
  </div>

  <div class="manifesto">// <b>An Agentic Engineering Manifesto</b><span class="cur"></span></div>

</body>
</html>
